version: 2

builds:
  - main: ./cmd/tabloio
    binary: tabloio
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # GoReleaser's defaults, and the pre-commit hook of design 1422.
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - hooks/pre-commit

checksum:
  name_template: checksums.txt
