title: Agent briefs
description: >
  A brief flag on the work queue command that writes a self-contained Markdown
  brief for one queue item: the task, the gate and its criteria, the junction
  references, the requirement texts and the commit the agent makes when done.
  A person or a harness pastes the brief into an agent's session.
