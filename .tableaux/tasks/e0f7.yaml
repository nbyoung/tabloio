title: Text renderers
description: >
  The --text format for every view: the same content as the Markdown
  rendering drawn with Unicode box characters, the gate and state symbols,
  and indentation for the tree, sized to a terminal width, for a shell, a log
  or a message where no Markdown viewer exists.
