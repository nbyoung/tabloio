title: Bootstrap
description: >
  The Go module github.com/nbyoung/tabloio depending on tablo through a declared
  version range, with licence, README and continuous integration.
  A release workflow cross-compiles one static binary for Linux, macOS and
  Windows on amd64 and arm64 and publishes them, so no user installs Go.
