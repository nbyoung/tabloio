title: Write commands
description: >
  The propose, record, review, reaffirm and authorise subcommands. Each writes
  the task or status file the method prescribes, or composes the commit with the
  right trailers, and shows the commit before making it. Propose allocates a
  fresh id; review and authorise accept several tasks at once.
